name: Build & Deploy to EC2

# ──────────────────────────────────────────────────────────────
# Professional CI/CD for EventNexus (3 services)
# • Build optimized Docker images with BuildKit + GHCR cache
# • Push to GHCR (ghcr.io/<owner>/event-*)
# • Deploy to single EC2 via SSH with zero-downtime compose pull
# Trigger: push to main (+ manual dispatch). Builds run in parallel.
# EC2 provisioning: see docs/EC2_SETUP.md
# ──────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "IR-*.pdf"
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip build and only redeploy existing images on EC2"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # IMAGE_PREFIX = "<owner>/<repo-basename>" — GHCR requires it lowercase, and
  # GitHub Actions expressions have no lower() function, so hardcode it for this
  # repo (github.repository_owner is "Anjali0616" → cache refs reject uppercase).
  IMAGE_PREFIX: anjali0616/event

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────
  # 1) Build & push images (parallel, cached)
  # ──────────────────────────────────────────────────────────
  build-backend:
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=eventnexus-backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:buildcache,mode=max
          platforms: linux/amd64
          provenance: false

  build-frontend:
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=ref,event=branch

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* are baked at build time — override via repository variables or secrets
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL != '' && vars.NEXT_PUBLIC_API_URL || 'http://localhost:5000/api' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID != '' && vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:buildcache,mode=max
          platforms: linux/amd64
          provenance: false

  build-ai:
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=ref,event=branch

      - name: Build and push ai-service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-service:buildcache,mode=max
          platforms: linux/amd64
          provenance: false

  # ──────────────────────────────────────────────────────────
  # 2) Deploy to EC2
  # ──────────────────────────────────────────────────────────
  deploy:
    # Run after builds; if skip_build, run immediately
    needs: [build-backend, build-frontend, build-ai]
    if: |
      always() &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-ai.result == 'success' || needs.build-ai.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "${{ secrets.EC2_HOST }}" ]; then echo "::error::Missing secret EC2_HOST"; missing=1; fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then echo "::error::Missing secret EC2_USER"; missing=1; fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then echo "::error::Missing secret EC2_SSH_KEY"; missing=1; fi
          if [ $missing -eq 1 ]; then
            echo "::error::Set EC2_HOST, EC2_USER, EC2_SSH_KEY in GitHub > Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT != '' && secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "== EventNexus deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) =="
            echo "== Host: $(hostname) | Docker: $(docker --version) | Compose: $(docker compose version) =="

            # ------------------------------------------------------------------
            # 0) Ensure deploy directory & compose file present
            #    First deploy: repo is cloned shallowly. Subsequent: git pull.
            # ------------------------------------------------------------------
            DEPLOY_DIR="$HOME/eventnexus"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo ">> First deploy — cloning $REPO_URL ($BRANCH) into $DEPLOY_DIR"
              rm -rf "$DEPLOY_DIR"
              git clone --branch "$BRANCH" --depth 1 "$REPO_URL" "$DEPLOY_DIR"
            else
              echo ">> Updating existing checkout"
              cd "$DEPLOY_DIR"
              git fetch origin "$BRANCH" --depth 1
              git reset --hard "origin/$BRANCH"
              cd -
            fi
            cd "$DEPLOY_DIR"

            # ------------------------------------------------------------------
            # 1) Write env files from GitHub Secrets (if provided)
            #    Secrets are expected to contain FULL file contents, not single vars.
            #    Fallback: keep existing files on host (do not overwrite with empty).
            # ------------------------------------------------------------------
            # Helper: write secret to file only if secret is non-empty
            write_env() {
              local secret_val="$1"
              local dest="$2"
              if [ -n "$secret_val" ]; then
                printf "%s" "$secret_val" > "$dest"
                # Ensure file ends with newline (compose env_file parsing)
                tail -c1 "$dest" | read -r _ || echo >> "$dest"
                chmod 600 "$dest"
                echo ">> Wrote $dest ($(wc -l < "$dest") lines)"
              else
                if [ -f "$dest" ]; then
                  echo ">> Keep existing $dest (secret not set)"
                else
                  echo "::warning:: $dest missing and secret not set — service may fail to start"
                fi
              fi
            }

            # NOTE: set these three Repository Secrets to the FULL .env contents
            #   BACKEND_ENV  -> backend/.env  (MONGODB_URI, JWT_SECRET, etc.)
            #   AI_ENV       -> ai-service/.env
            #   FRONTEND_ENV -> frontend env (optional, for future runtime use)
            # Alternatively set no secrets and pre-create files manually on EC2 — deploy keeps them.
            write_env "${{ secrets.BACKEND_ENV }}" "$DEPLOY_DIR/backend.env"
            write_env "${{ secrets.AI_ENV }}"      "$DEPLOY_DIR/ai.env"
            write_env "${{ secrets.FRONTEND_ENV }}" "$DEPLOY_DIR/frontend.env"

            # ------------------------------------------------------------------
            # 2) Authenticate to GHCR on EC2 (for private images)
            #    Uses GITHUB_TOKEN actor; for private repos create a PAT with
            #    read:packages and store as GHCR_PAT, else anonymous may fail.
            # ------------------------------------------------------------------
            GHCR_USER="${{ github.actor }}"
            GHCR_TOKEN="${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}"
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # ------------------------------------------------------------------
            # 3) Pull & rolling update (zero-downtime)
            # ------------------------------------------------------------------
            # GHCR image refs MUST be lowercase; github.repository_owner may not be.
            export IMAGE_PREFIX="$(echo "${{ env.IMAGE_PREFIX }}" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_TAG="latest"
            # If workflow was triggered by tag/SHA, you may want sha pinning:
            # export IMAGE_TAG="${{ github.sha }}"
            # For now we track :latest (mutable) + :<short-sha> (immutable)

            # Edge/TLS config consumed by docker-compose.prod.yml → infra/Caddyfile.
            export DOMAIN="${{ vars.DOMAIN != '' && vars.DOMAIN || 'eventnexus.tech' }}"
            export ACME_EMAIL="${{ secrets.ACME_EMAIL != '' && secrets.ACME_EMAIL || format('admin@{0}', vars.DOMAIN != '' && vars.DOMAIN || 'eventnexus.tech') }}"
            # Force the production frontend origin into the backend container
            # (compose `environment` overrides whatever the BACKEND_ENV secret carries).
            # Override via repo variable FRONTEND_URL only if you need extra origins.
            export FRONTEND_URL="${{ vars.FRONTEND_URL != '' && vars.FRONTEND_URL || format('https://{0},https://www.{0}', vars.DOMAIN != '' && vars.DOMAIN || 'eventnexus.tech') }}"
            echo ">> Edge: DOMAIN=$DOMAIN  ACME_EMAIL=$ACME_EMAIL"
            echo ">> Backend FRONTEND_URL=$FRONTEND_URL"

            echo ">> Pulling images: $IMAGE_PREFIX-*:latest"
            docker compose -f docker-compose.prod.yml pull

            echo ">> Starting services (recreate only changed)"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo ">> Waiting for healthchecks (max 90s)"
            # Wait for backend + ai + frontend + caddy to be healthy
            for svc in ai-service backend frontend caddy; do
              echo "   - $svc ..."
              for i in $(seq 1 30); do
                status=$(docker inspect --format='{{.State.Health.Status}}' "eventnexus-$svc" 2>/dev/null || echo "nohealth")
                # Fallback: check running
                if [ "$status" = "healthy" ]; then echo "     ✓ $svc healthy"; break; fi
                if [ "$status" = "nohealth" ]; then
                  # No healthcheck defined — check running state
                  if docker ps --filter "name=eventnexus-$svc" --filter "status=running" | grep -q eventnexus; then
                    echo "     ✓ $svc running (no healthcheck)"; break;
                  fi
                fi
                sleep 3
                if [ $i -eq 30 ]; then echo "     ! $svc not healthy after 90s (continuing)"; fi
              done
            done

            echo ">> Current status"
            docker compose -f docker-compose.prod.yml ps -a
            echo ">> Recent logs (tail 50)"
            docker compose -f docker-compose.prod.yml logs --tail 50 || true

            # ------------------------------------------------------------------
            # 4) Smoke test (fail deploy if unhealthy)
            # ------------------------------------------------------------------
            echo ">> Smoke test — internal (container ports on 127.0.0.1)"
            curl -fsS http://127.0.0.1:5000/api/health  > /dev/null && echo "backend ok" || (echo "backend health failed" && exit 1)
            curl -fsS http://127.0.0.1:8000/health      > /dev/null && echo "ai ok" || (echo "ai health failed" && exit 1)
            curl -fsS http://127.0.0.1:3000/ > /dev/null && echo "frontend ok" || (echo "frontend health failed" && exit 1)

            echo ">> Smoke test — Caddy container is listening on :80/:443"
            if ! docker ps --filter "name=eventnexus-caddy" --filter "status=running" | grep -q eventnexus-caddy; then
              echo "caddy container not running" && exit 1
            fi
            echo "caddy running"

            echo ">> Smoke test — public HTTPS end-to-end (non-fatal on first run; ACME issuance can take ~60s)"
            https_ok=0
            for i in $(seq 1 15); do
              if curl -fsS --max-time 10 "https://$DOMAIN/api/health" > /dev/null 2>&1 \
                 && curl -fsS --max-time 10 "https://$DOMAIN/" > /dev/null 2>&1; then
                echo "     ✓ https://$DOMAIN (frontend + /api) ok"; https_ok=1; break
              fi
              echo "     … waiting for valid TLS cert + routing ($i/15)"; sleep 10
            done
            if [ "$https_ok" != "1" ]; then
              echo "::warning::HTTPS not verified yet. Check 'docker logs eventnexus-caddy'. Usual causes: DNS for $DOMAIN not pointing at this host, or the EC2 security group is missing inbound 80/443 (ACME HTTP-01 needs :80). Re-run once fixed — no rebuild needed."
            fi

            # ------------------------------------------------------------------
            # 5) Cleanup old images (keep last 2)
            # ------------------------------------------------------------------
            echo ">> Pruning dangling images"
            docker image prune -f --filter "until=24h" || true
            docker system df || true

            echo "== Deploy complete =="

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed — check EC2 logs: ssh \$EC2_USER@\$EC2_HOST 'cd ~/eventnexus && docker compose -f docker-compose.prod.yml logs --tail 100'"
